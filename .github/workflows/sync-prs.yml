name: Keep PRs in sync with main

# Whenever main moves or a PR into main changes, go through every open PR into
# main (PRs from forks are skipped, since we can't push to them):
#   - sync       -> merge main into the PR branch and push it, if that's clean
#   - conflicts  -> label the PR `merge-conflict` and comment once with the
#                   conflicting files; the PR is NOT merged
#   - resolved   -> remove the `merge-conflict` label once it's clean again
#   - build      -> build the synced branch (the PR with main merged in, i.e.
#                   exactly what would land) in Release: the app project plus
#                   tools/NetCheck.cs. If that fails, label the PR
#                   `build-failed`, comment once with the end of the build
#                   output, and do NOT merge it. The label is removed once it
#                   builds again. Each commit is built at most once per run.
#   - auto-merge -> if the PR is clean, builds, is not a draft and has no
#                   `do-not-merge` label, squash-merge it into main (same run,
#                   right after the sync and build)
#
# Drafts and `do-not-merge` PRs are still synced and built (so the label tells
# you early), they just aren't merged.
#
# Escape hatches: mark the PR as a draft, or add the `do-not-merge` label.
# Removing the label / marking it ready for review re-triggers this workflow.
#
# Merges and pushes made with GITHUB_TOKEN don't start new workflow runs, so a
# merge here won't fire the `push: main` trigger. Instead, after any merge the
# job goes through all open PRs again (bounded number of passes), so the rest
# get re-synced against the new main. Nothing re-dispatches the workflow, so
# it can't loop.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

# One run at a time, so two PRs can't race to merge. GitHub keeps at most one
# pending run per group (newer pending runs replace older ones), which is fine
# because every run handles ALL open PRs, not just the one that triggered it.
concurrency:
  group: sync-prs
  cancel-in-progress: false

jobs:
  sync:
    # Fork PRs get a read-only token, so there's nothing useful we can do.
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Sync, build and auto-merge open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: merge-conflict
          HOLD_LABEL: do-not-merge
          BUILD_LABEL: build-failed
          BUILD_LOG_LINES: 30   # lines of build output quoted in the PR comment
          DOTNET_NOLOGO: "true"
          DOTNET_CLI_TELEMETRY_OPTOUT: "true"
          MAX_PASSES: 10        # upper bound on "re-sync after a merge" passes
          MERGEABLE_TIMEOUT: 90 # seconds to wait for GitHub to compute mergeability
        run: |
          # No `-e`: errors are handled per PR so one bad PR doesn't stop the rest.
          set +e -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          gh label create "$LABEL" --color B60205 \
            --description "This PR has merge conflicts with main" --force >/dev/null
          gh label create "$HOLD_LABEL" --color FBCA04 \
            --description "Don't auto-merge this PR" --force >/dev/null
          gh label create "$BUILD_LABEL" --color D93F0B \
            --description "This PR doesn't build once merged with main" --force >/dev/null

          # Pick an allowed merge method, preferring squash.
          method=$(gh api "repos/$GITHUB_REPOSITORY" --jq '
            if .allow_squash_merge then "squash"
            elif .allow_merge_commit then "merge"
            elif .allow_rebase_merge then "rebase"
            else "" end')
          echo "Merge method: ${method:-none allowed, auto-merge disabled}"

          # Wait until GitHub has seen $2 as the head of PR $1 and finished
          # computing mergeability. Prints the PR JSON, or fails on timeout.
          wait_for_mergeable() {
            local num=$1 sha=$2 deadline=$((SECONDS + MERGEABLE_TIMEOUT)) info
            while :; do
              info=$(gh pr view "$num" --json state,isDraft,labels,mergeable,headRefOid)
              if [ "$(jq -r .headRefOid <<<"$info")" = "$sha" ] &&
                 [ "$(jq -r .mergeable <<<"$info")" != "UNKNOWN" ]; then
                echo "$info"; return 0
              fi
              [ "$SECONDS" -ge "$deadline" ] && return 1
              sleep 5
            done
          }

          # Build the checked-out commit $1 in Release. The full output goes to
          # the job log and to build-<sha>.log; results are cached per commit,
          # so later passes don't rebuild a commit that hasn't changed.
          # Returns 0 if it builds.
          build_commit() {
            local sha=$1 log="$RUNNER_TEMP/build-$1.log" rc=0
            if [ -f "$log.ok" ]; then echo "Commit $sha already built OK in this run."; return 0; fi
            if [ -f "$log" ];    then echo "Commit $sha already failed to build in this run."; return 1; fi
            { dotnet build src/PathFinder/PathFinder.csproj -c Release &&
              dotnet build tools/NetCheck.cs -c Release; } 2>&1 | tee "$log" || rc=1
            git clean -ffdxq   # drop bin/ and obj/ before the next PR's checkout
            [ "$rc" -eq 0 ] && touch "$log.ok"
            return "$rc"
          }

          # Sync one PR with main and merge it if allowed.
          # Returns 0 only if the PR was merged into main.
          process_pr() {
            local pr=$1 num branch fork labeled held draft broken info sha
            num=$(jq -r .number <<<"$pr")
            branch=$(jq -r .headRefName <<<"$pr")
            fork=$(jq -r .isCrossRepository <<<"$pr")
            draft=$(jq -r .isDraft <<<"$pr")
            labeled=$(jq -r --arg l "$LABEL" '[.labels[].name] | index($l) != null' <<<"$pr")
            held=$(jq -r --arg l "$HOLD_LABEL" '[.labels[].name] | index($l) != null' <<<"$pr")
            broken=$(jq -r --arg l "$BUILD_LABEL" '[.labels[].name] | index($l) != null' <<<"$pr")

            if [ "$fork" = "true" ]; then
              echo "Skipping: PR comes from a fork, can't push to it."; return 1
            fi

            if ! { git fetch origin main "$branch" && git checkout -B "$branch" "origin/$branch"; }; then
              echo "::warning::Could not check out $branch"; return 1
            fi

            # --- 1. Sync main into the PR branch -------------------------------
            if git merge-base --is-ancestor origin/main HEAD; then
              echo "Already up to date with main."
            elif git merge --no-edit origin/main -m "Merge main into $branch (auto-sync)"; then
              if ! git push origin "HEAD:$branch"; then
                echo "::warning::Push to $branch failed (branch probably moved); will retry next run."
                return 1
              fi
              echo "Merged main cleanly and pushed."
            else
              local files
              files=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
              git merge --abort
              echo "Conflicts detected:"; echo "$files"
              if [ "$labeled" != "true" ]; then
                gh pr edit "$num" --add-label "$LABEL"
                gh pr comment "$num" --body "$(cat <<MSG
          :warning: **This PR has merge conflicts with \`main\`** and couldn't be updated or auto-merged.

          Conflicting files:
          $files

          To fix locally:
          \`\`\`bash
          git checkout $branch
          git pull origin main   # resolve the conflicts, then:
          git add . && git commit && git push
          \`\`\`
          The \`$LABEL\` label will be removed automatically once the conflicts are resolved.
          MSG
                )"
              fi
              return 1
            fi
            [ "$labeled" = "true" ] && gh pr edit "$num" --remove-label "$LABEL"

            # --- 2. Build exactly what would land ------------------------------
            sha=$(git rev-parse HEAD)
            if ! build_commit "$sha"; then
              echo "Build failed."
              if [ "$broken" != "true" ]; then
                gh pr edit "$num" --add-label "$BUILD_LABEL"
                gh pr comment "$num" --body "$(cat <<MSG
          :x: **This PR doesn't build once merged with \`main\`**, so it won't be auto-merged.

          \`dotnet build -c Release\` failed on $sha. End of the output:
          \`\`\`text
          $(tail -n "$BUILD_LOG_LINES" "$RUNNER_TEMP/build-$sha.log")
          \`\`\`
          The \`$BUILD_LABEL\` label will be removed automatically once it builds again.
          MSG
                )"
              fi
              return 1
            fi
            [ "$broken" = "true" ] && gh pr edit "$num" --remove-label "$BUILD_LABEL"

            # --- 3. Auto-merge into main ---------------------------------------
            [ -z "$method" ] && return 1
            if [ "$draft" = "true" ] || [ "$held" = "true" ]; then
              echo "Not merging: draft or '$HOLD_LABEL' label."; return 1
            fi

            if ! info=$(wait_for_mergeable "$num" "$sha"); then
              echo "::warning::GitHub didn't report mergeability for #$num in time; will retry next run."
              return 1
            fi

            # Re-check the escape hatches with fresh data right before merging.
            if [ "$(jq -r '.state' <<<"$info")" != "OPEN" ] ||
               [ "$(jq -r '.isDraft' <<<"$info")" = "true" ] ||
               [ "$(jq -r --arg l "$HOLD_LABEL" '[.labels[].name] | index($l) != null' <<<"$info")" = "true" ]; then
              echo "Not merging: PR closed, became a draft, or got the '$HOLD_LABEL' label."; return 1
            fi
            if [ "$(jq -r .mergeable <<<"$info")" != "MERGEABLE" ]; then
              echo "Not merging: GitHub says mergeable=$(jq -r .mergeable <<<"$info")."; return 1
            fi

            # --match-head-commit: refuse if someone pushed after our checks.
            if gh pr merge "$num" "--$method" --match-head-commit "$sha"; then
              echo "Merged #$num into main ($method)."; return 0
            fi
            echo "::warning::Merging #$num failed; will retry next run."
            return 1
          }

          # Merging moves main, so after any merge go around again to re-sync
          # the remaining PRs. Every merge closes a PR, so this always ends;
          # MAX_PASSES is just a safety net.
          for pass in $(seq 1 "$MAX_PASSES"); do
            echo "=== Pass $pass ==="
            merged_any=false
            prs=$(gh pr list --state open --base main --limit 100 \
                  --json number,headRefName,isCrossRepository,isDraft,labels)
            while read -r pr; do
              [ -z "$pr" ] && continue
              echo "::group::PR #$(jq -r .number <<<"$pr") ($(jq -r .headRefName <<<"$pr"))"
              process_pr "$pr" </dev/null && merged_any=true  # keep gh off the loop's stdin
              echo "::endgroup::"
            done < <(jq -c '.[]' <<<"$prs")
            [ "$merged_any" = "true" ] || break
          done
          exit 0
